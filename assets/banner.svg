<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Miguel Balladares - Desenvolvimento, testes de API e qualidade">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#161b3a"/>
      <stop offset="1" stop-color="#2a1b4d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- grade sutil -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 50H1200M0 100H1200M0 150H1200M0 200H1200M0 250H1200"/>
    <path d="M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300M800 0V300M900 0V300M1000 0V300M1100 0V300"/>
  </g>

  <!-- janela de terminal decorativa -->
  <g transform="translate(820 52)">
    <rect width="320" height="196" rx="12" fill="#0d1117" stroke="#30363d"/>
    <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="62" cy="20" r="6" fill="#27c93f"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="15">
      <text x="22" y="62" fill="#7ee787">$ npm run check</text>
      <text x="22" y="88" fill="#8b949e">format  lint  types  tests</text>
      <text x="22" y="114" fill="#58a6ff">✔ all checks passed</text>
      <text x="22" y="150" fill="#7ee787">$ newman run auth.json</text>
      <text x="22" y="176" fill="#bc8cff">✔ assertions ok</text>
    </g>
  </g>

  <!-- texto principal -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="70" y="122" font-size="58" font-weight="700" fill="#f0f6fc">Miguel Balladares</text>
    <rect x="72" y="140" width="150" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="70" y="190" font-size="26" fill="#c9d1d9">Desenvolvimento · Testes de API · Qualidade</text>
    <text x="70" y="232" font-size="20" font-family="Consolas, 'Courier New', monospace" fill="#8b949e">@miguettohuertas</text>
  </g>
</svg>
